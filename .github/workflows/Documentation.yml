name: Documentation
run-name: "Documentation${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

# On a pull request, a label starts its own run through Labels.yml
# (CTActions docs/workflows/label-dispatch.md).

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'   # v0.6.0 yes, v0.6.0-beta no (SITE13)
  # run on a tag by ReleaseTag.yml: a tag it creates triggers no push event
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number, set by label-dispatch.yml'
        required: false
        default: ''
      preview:
        description: 'Deploy the preview of the pull request (label documentation push preview)'
        required: false
        default: 'false'

# The GPU upgrade pass (`gpu_runner` below) can run long after the CPU build. Without
# this, an older run's GPU pass could redeploy older content over a newer CPU build.
# Push and tag runs queue (GitHub keeps only the newest pending one), so no Julia process
# is killed on the self-hosted runner; PR runs are GitHub-hosted only and are cancelled.
# Tags carry their own ref, so a release build never waits for `main`.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr != '') }}

jobs:
  call:
    uses: control-toolbox/CTActions/.github/workflows/documentation.yml@main
    with:
      use_ct_registry: true
      # Publish then upgrade (CTActions documentation.yml): the GitHub-hosted `build`
      # always deploys first; `build-gpu` then rebuilds on a GPU runner so that the GPU
      # page shows real GPU output: kkt unless it is offline, else occidata ('auto').
      # Push/tag only, never fails the workflow. The timeout is sized for the occidata
      # fallback (a cold build takes ~40 min there).
      gpu_runner: 'auto'
      gpu_timeout_minutes: 180
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      CT_RUNNERS_CLIENT_ID: ${{ secrets.CT_RUNNERS_CLIENT_ID }}
      CT_RUNNERS_PRIVATE_KEY: ${{ secrets.CT_RUNNERS_PRIVATE_KEY }}
