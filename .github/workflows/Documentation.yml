name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'   # v0.6.0 yes, v0.6.0-beta no (SITE13)
  pull_request:
    types: [labeled, synchronize, reopened]

# The GPU upgrade pass (`gpu_runner` below) can run long after the CPU build. Without
# this, an older run's GPU pass could redeploy older content over a newer CPU build.
# Tags carry their own ref, so a release build is never cancelled by a push to `main`.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    # On a PR, `run documentation` is the only trigger. `documentation push preview` is a
    # modifier: with `run documentation` present, the build also deploys its preview
    # (CTActions sets DOCUMENTER_PUSH_PREVIEW from it); on its own it does nothing. Adding
    # it to a PR that already has `run documentation` re-runs the build with the preview.
    # A 'labeled' event fires once per label added, so it reacts only to these two labels;
    # synchronize/reopened check the current label set.
    if: >
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run documentation') &&
        (github.event.action != 'labeled' ||
         github.event.label.name == 'run documentation' ||
         github.event.label.name == 'documentation push preview'))
    uses: control-toolbox/CTActions/.github/workflows/documentation.yml@main
    with:
      use_ct_registry: true
      # Publish then upgrade (CTActions documentation.yml): the GitHub-hosted `build`
      # always deploys first; `build-gpu` then rebuilds on the kkt GPU runner so that
      # the GPU page shows real GPU output. Push/tag only, never fails the workflow.
      gpu_runner: '["kkt"]'
      gpu_timeout_minutes: 120
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
