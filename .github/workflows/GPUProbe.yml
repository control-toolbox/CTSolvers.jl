name: GPU probe

# Runs the standalone GPU capability probe (probe/gpu/probe_gpu.jl) on the
# self-hosted NVIDIA/CUDA runner kkt. Diagnostic only: it prints capability
# matrices and always succeeds (experiments are individually try/catch'd). See
# probe/README.md.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  gpu-probe:
    # Run manually (workflow_dispatch) or on a PR carrying the 'run probe' label.
    # React to 'labeled' only for this label (a 'labeled' event fires once per label
    # added); for synchronize/reopened, check the current label set.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run probe') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run probe'))
    runs-on: ["kkt"]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Add ct-registry
        uses: julia-actions/add-julia-registry@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          registry: control-toolbox/ct-registry

      - name: Run GPU probe
        run: julia --project=probe/gpu probe/gpu/probe_gpu.jl
